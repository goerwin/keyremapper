<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a6cf5"/>
      <stop offset="0.55" stop-color="#4632c4"/>
      <stop offset="1" stop-color="#1c1257"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.72">
      <stop offset="0" stop-color="#c9c2ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#b3a8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="keycap" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9d4ff"/>
    </linearGradient>
    <linearGradient id="keytop" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ece9ff"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24"/>
      <feOffset dy="26"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#background)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g filter="url(#soft-shadow)">
    <rect x="204" y="204" width="616" height="616" rx="140" fill="url(#keycap)"/>
  </g>
  <rect x="252" y="226" width="520" height="506" rx="106" fill="url(#keytop)" stroke="#ffffff" stroke-opacity="0.9" stroke-width="4"/>

  <g fill="#2a1d86">
    <rect x="404" y="327" width="216" height="64" rx="13"/>
    <rect x="404" y="327" width="66" height="304" rx="13"/>
    <rect x="404" y="447" width="189" height="64" rx="13"/>
    <rect x="404" y="567" width="216" height="64" rx="13"/>
  </g>
</svg>
