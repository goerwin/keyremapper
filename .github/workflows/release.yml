on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # builds without releasing, to check the signing secrets
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64_PASSWORD }}
      APP_CERTIFICATE: ${{ secrets.MAC_APP_CERTIFICATE }}
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v4

      - name: Tests
        run: make test

      - name: Build app
        working-directory: ./mac
        run: bash buildApp.sh ${{github.ref_name}}

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: macArtifact
          retention-days: 1
          path: |
            mac/dist/mac.zip

  build-win:
    runs-on: windows-latest
    steps:
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - uses: actions/checkout@v4

      # TODO:
      # - name: Tests
      # - run: g++ -o Tests/output -std=c++17 Tests/index.cpp && ./Tests/output
      # open `Developer PowerShell for VS 2022` or similar
      # $ cl .\Tests\index.cpp /std:c++17 /Fe"Tests/output.exe" /Fo"Tests/output.obj" | .\Tests\output.exe

      - name: Build and zip the app
        working-directory: ./win
        run: |
          bash buildSetVersion.sh ${{github.ref_name}}
          powershell .\buildApp.ps1

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: winArtifact
          retention-days: 1
          path: |
            win/dist/win.zip

  release:
    runs-on: ubuntu-latest
    needs: [build-mac, build-win]
    # a failing Windows build doesn't block the Mac release
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.build-mac.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macArtifact
          path: buildMac

      - uses: actions/download-artifact@v4
        if: needs.build-win.result == 'success'
        with:
          name: winArtifact
          path: buildWin

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            buildMac/mac.zip
            buildWin/win.zip
