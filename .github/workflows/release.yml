on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # builds without releasing, to check the signing secrets
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64_PASSWORD }}
      APP_CERTIFICATE: ${{ secrets.MAC_APP_CERTIFICATE }}
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v7

      - name: Tests
        run: make test test-runtime

      # In a keychain of the runner, which is discarded after the job
      - name: Install the signing certificate
        run: |
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD APP_CERTIFICATE; do
            [[ -n "${!name}" ]] || { echo "Error: the secret for $name isn't set" >&2; exit 1; }
          done

          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychain -d user -s "$keychain"

      - name: Build app
        run: |
          sed -i '' -e "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = ${GITHUB_REF_NAME#v};/" KeyRemapper.xcodeproj/project.pbxproj
          # Manual signing, there's no Apple account on the runner to sign automatically
          xcodebuild archive -target KeyRemapper -configuration Release \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$APP_CERTIFICATE"

          # build/Release/KeyRemapper.app is a symlink to the archived app, -H follows it
          mkdir -p dist/mac
          cp -RH build/Release/KeyRemapper.app dist/mac
          (cd dist && zip -qr mac.zip .)

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: macArtifact
          retention-days: 1
          path: |
            dist/mac.zip

  release:
    runs-on: ubuntu-latest
    needs: [build-mac]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # release.sh writes the notes in the annotated tag message
      - name: Release notes
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md

      - uses: actions/download-artifact@v8
        with:
          name: macArtifact
          path: buildMac

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: |
            buildMac/mac.zip
