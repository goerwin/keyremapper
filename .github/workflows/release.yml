on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # builds without releasing, to check the signing secrets
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64_PASSWORD }}
      APP_CERTIFICATE: ${{ secrets.MAC_APP_CERTIFICATE }}
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v7

      - name: Tests
        run: make test test-runtime

      - name: Build app
        run: bash buildApp.sh ${{github.ref_name}}

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: macArtifact
          retention-days: 1
          path: |
            dist/mac.zip

  release:
    runs-on: ubuntu-latest
    needs: [build-mac]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # release.sh writes the notes in the annotated tag message
      - name: Release notes
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md

      - uses: actions/download-artifact@v8
        with:
          name: macArtifact
          path: buildMac

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: |
            buildMac/mac.zip
